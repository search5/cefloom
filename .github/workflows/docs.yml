name: docs

# Builds the Sphinx site (English and Korean) and publishes it to GitHub Pages. Runs only when started by hand:
# Actions tab -> docs -> Run workflow.
# Needs Settings -> Pages -> Source: "GitHub Actions". The site needs no CEF runtime: the API pages are
# written from php/cefloom.stub.php, and the generator modules are read by autodoc.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (warnings are errors)
        run: make -C docs site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
